<!DOCTYPE html>
<html><body style="margin:0;font-family:sans-serif;">
<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  
  <rect width="800" height="300" fill="#FAFAFA" rx="10"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="bold">逐步决策闭环</text>
  
  <!-- 感知 -->
  <rect x="320" y="60" width="160" height="50" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">感知</text>
  <text x="400" y="100" text-anchor="middle" font-size="11" fill="#333">ObsParser提取状态</text>
  
  <line x1="400" y1="110" x2="400" y2="130" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- 六爻编码 -->
  <rect x="320" y="135" width="160" height="50" rx="8" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="400" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#388E3C">六爻编码</text>
  <text x="400" y="175" text-anchor="middle" font-size="11" fill="#333">build_yao()→[y₀...y₅]</text>
  
  <line x1="400" y1="185" x2="400" y2="205" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- 模糊推理 -->
  <rect x="320" y="210" width="160" height="50" rx="8" fill="#FCE4EC" stroke="#C62828" stroke-width="2"/>
  <text x="400" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#C62828">模糊推理</text>
  <text x="400" y="250" text-anchor="middle" font-size="11" fill="#333">8规则→选择意图</text>
  
  <!-- 箭头右转 -->
  <line x1="480" y1="235" x2="510" y2="235" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- 执行 -->
  <rect x="515" y="210" width="120" height="50" rx="8" fill="#FFEBEE" stroke="#B71C1C" stroke-width="2"/>
  <text x="575" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#B71C1C">执行</text>
  <text x="575" y="250" text-anchor="middle" font-size="11" fill="#333">env.step()</text>
  
  <!-- 箭头下转 -->
  <line x1="575" y1="260" x2="575" y2="280" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- 反馈 -->
  <rect x="160" y="210" width="120" height="50" rx="8" fill="#FFF9C4" stroke="#F57F17" stroke-width="2"/>
  <text x="220" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#F57F17">反馈</text>
  <text x="220" y="250" text-anchor="middle" font-size="11" fill="#333">update()更新状态</text>
  
  <!-- 反馈→感知回环 -->
  <path d="M220,210 L220,85 L320,85" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  
  <!-- 反馈→六爻回环 -->
  <path d="M280,235 L280,160 L320,160" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#ar)"/>
  
  <!-- 循环标注 -->
  <text x="255" y="128" font-size="11" fill="#999">六爻再编码</text>
  <text x="155" y="100" font-size="11" fill="#999">新obs驱动重感知</text>
</svg>
</body></html>
