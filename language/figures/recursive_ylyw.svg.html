<!DOCTYPE html>
<html><body style="margin:20px;font-family:sans-serif;">
<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666" />
    </marker>
  </defs>

  <!-- L1 -->
  <rect x="50" y="20" width="220" height="60" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" />
  <text x="160" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565C0">L1: 字级YLYW</text>
  <text x="160" y="65" text-anchor="middle" font-size="12" fill="#333">部首卦象矩阵 → 字卦象</text>

  <!-- L2 -->
  <rect x="50" y="110" width="220" height="60" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2" />
  <text x="160" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#E65100">L2: 词级YLYW</text>
  <text x="160" y="155" text-anchor="middle" font-size="12" fill="#333">字卦象矩阵 → 词卦象</text>

  <!-- L3 -->
  <rect x="50" y="200" width="220" height="60" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" />
  <text x="160" y="225" text-anchor="middle" font-size="15" font-weight="bold" fill="#2E7D32">L3: 句级YLYW</text>
  <text x="160" y="245" text-anchor="middle" font-size="12" fill="#333">词卦象矩阵 → 句卦象</text>

  <!-- L1→L2 -->
  <line x1="160" y1="80" x2="160" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <!-- L2→L3 -->
  <line x1="160" y1="170" x2="160" y2="200" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 右侧核心框 -->
  <rect x="350" y="20" width="400" height="240" rx="10" fill="#F5F5F5" stroke="#999" stroke-width="1" />
  <text x="550" y="45" text-anchor="middle" font-size="14" font-weight="bold">每层YLYW推理引擎</text>

  <!-- 步骤1 -->
  <rect x="370" y="60" width="360" height="50" rx="6" fill="#FFF" stroke="#CCC" />
  <text x="390" y="80" font-size="13" font-weight="bold">步骤1: 乘承比应关系</text>
  <text x="390" y="98" font-size="12" fill="#666">乘(支配) | 承(承载) | 比(并列) | 应(远呼应)</text>

  <line x1="550" y1="110" x2="550" y2="120" stroke="#666" stroke-width="1" marker-end="url(#arrow)" />

  <!-- 步骤2 -->
  <rect x="370" y="125" width="360" height="50" rx="6" fill="#FFF" stroke="#CCC" />
  <text x="390" y="145" font-size="13" font-weight="bold">步骤2: 六爻编码</text>
  <text x="390" y="163" font-size="12" fill="#666">6维连续向量编码元素间关系</text>

  <line x1="550" y1="175" x2="550" y2="185" stroke="#666" stroke-width="1" marker-end="url(#arrow)" />

  <!-- 步骤3 -->
  <rect x="370" y="190" width="360" height="50" rx="6" fill="#FFF" stroke="#CCC" />
  <text x="390" y="210" font-size="13" font-weight="bold">步骤3: 六十四卦匹配</text>
  <text x="390" y="228" font-size="12" fill="#666">向量→余弦相似度→最高分卦象</text>

  <text x="400" y="285" font-size="12" fill="#999">▲ 每一层都执行同样的三步推理流程</text>
</svg>
</body></html>
