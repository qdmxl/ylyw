<!DOCTYPE html>
<html><body style="margin:0;font-family:sans-serif;">
<svg width="800" height="340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  
  <rect width="800" height="340" fill="#FAFAFA" rx="10"/>
  
  <!-- L1 -->
  <rect x="30" y="20" width="240" height="70" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="150" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0">L1: 字级YLYW</text>
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#333">部首卦象矩阵 → 字卦象</text>
  
  <line x1="150" y1="90" x2="150" y2="113" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- L2 -->
  <rect x="30" y="118" width="240" height="70" rx="8" fill="#FFF3E0" stroke="#E65100" stroke-width="2"/>
  <text x="150" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100">L2: 词级YLYW</text>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#333">字卦象矩阵 → 词卦象</text>
  
  <line x1="150" y1="188" x2="150" y2="211" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
  
  <!-- L3 -->
  <rect x="30" y="216" width="240" height="70" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="150" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E7D32">L3: 句级YLYW</text>
  <text x="150" y="268" text-anchor="middle" font-size="12" fill="#333">词卦象矩阵 → 句卦象</text>
  
  <!-- 右侧每层推理引擎 -->
  <rect x="320" y="20" width="450" height="270" rx="10" fill="#F5F5F5" stroke="#999" stroke-width="1"/>
  <text x="545" y="52" text-anchor="middle" font-size="15" font-weight="bold">每层YLYW推理引擎(三步流程)</text>
  
  <!-- 步骤1 -->
  <rect x="340" y="70" width="410" height="55" rx="6" fill="#FFF" stroke="#CCC"/>
  <text x="360" y="93" font-size="14" font-weight="bold">步骤1: 乘承比应关系计算</text>
  <text x="360" y="113" font-size="12" fill="#555">乘(支配) | 承(承载) | 比(并列) | 应(远呼应)</text>
  
  <line x1="545" y1="125" x2="545" y2="138" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  
  <!-- 步骤2 -->
  <rect x="340" y="143" width="410" height="55" rx="6" fill="#FFF" stroke="#CCC"/>
  <text x="360" y="166" font-size="14" font-weight="bold">步骤2: 六爻编码</text>
  <text x="360" y="186" font-size="12" fill="#555">将乘承比应关系映射到6维连续向量</text>
  
  <line x1="545" y1="198" x2="545" y2="211" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
  
  <!-- 步骤3 -->
  <rect x="340" y="216" width="410" height="55" rx="6" fill="#FFF" stroke="#CCC"/>
  <text x="360" y="239" font-size="14" font-weight="bold">步骤3: 六十四卦匹配</text>
  <text x="360" y="259" font-size="12" fill="#555">6维爻向量与64卦理想模板余弦相似度取最高分</text>
  
  <text x="380" y="310" font-size="12" fill="#999">▲ 每一层都执行同样的三步YLYW推理流程</text>
</svg>
</body></html>
