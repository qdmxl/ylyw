<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1f3c"/>
      <stop offset="0.5" stop-color="#062247"/>
      <stop offset="1" stop-color="#04162f"/>
    </linearGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#8fd0f0"/>
    </linearGradient>
    <!-- 机甲金属：蓝白 -->
    <linearGradient id="mLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.5" stop-color="#cfe2f0"/>
      <stop offset="1" stop-color="#8fb4d0"/>
    </linearGradient>
    <linearGradient id="mMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9dc0da"/>
      <stop offset="0.5" stop-color="#4f7ba1"/>
      <stop offset="1" stop-color="#244864"/>
    </linearGradient>
    <linearGradient id="mDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6485"/>
      <stop offset="0.5" stop-color="#1d3f5c"/>
      <stop offset="1" stop-color="#0d2438"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03121f"/>
      <stop offset="0.5" stop-color="#0e3a56"/>
      <stop offset="1" stop-color="#020a12"/>
    </linearGradient>
    <!-- 发光 -->
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4fdff"/>
      <stop offset="0.3" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#1d9ccc"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe3ff" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#38b6e6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38b6e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#8ff0ff"/>
      <stop offset="1" stop-color="#2fb3dd"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1240" height="1754" fill="url(#bg)"/>

  <!-- ===== 书名 ===== -->
  <text x="620" y="220" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="112"
        font-weight="bold" fill="url(#titleG)" letter-spacing="20">易理研物</text>
  <text x="620" y="270" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="31"
        fill="#8fc3e0" letter-spacing="4">从符号先验到通用智能的工程研究</text>

  <!-- ===== 作者（副标题下方，图上方）===== -->
  <text x="620" y="336" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="36"
        fill="#dcecf6" letter-spacing="11">马兴录　马圣洁　李诚　著</text>
  <text x="620" y="378" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="21"
        fill="#7ea8c4">青岛科技大学　信息科学技术学院</text>

  <!-- ================= 机器人（头+颈，侧面）================= -->
  <g transform="translate(600,880)">
    <!-- 颈（侧面，向后倾斜）-->
    <g>
      <path d="M30 210 q6 -70 30 -104 l 60 18 q-26 42 -22 92 Z" fill="url(#mDark)"/>
      <path d="M64 118 l 52 16 M56 150 l 54 14 M48 182 l 56 12" stroke="#0b2033"
            stroke-width="6" opacity="0.75" fill="none"/>
      <path d="M96 96 l 22 -26 q6 -6 12 2 q5 7 -2 13 l -22 20 Z" fill="url(#mMid)"/>
    </g>

    <!-- 头（侧面朝右：额头-鼻梁-下巴轮廓）-->
    <g>
      <!-- 后脑/颅 -->
      <path d="M-4 24 q-22 -96 52 -122 q74 -24 116 40 q14 22 10 52
               q-4 30 -26 40 l -12 -30 q-70 8 -96 -30 Z" fill="url(#mMid)"/>
      <!-- 面部正面轮廓板 -->
      <path d="M-2 22 q6 -78 70 -100 q10 -3 22 -2 l 4 30 q-40 6 -56 34 q-10 18 -6 44 Z"
            fill="url(#mLight)"/>
      <!-- 头顶装甲脊 -->
      <path d="M40 -98 q40 -20 84 -4 l -8 22 q-36 -12 -70 4 Z" fill="url(#mLight)"/>
      <path d="M52 -92 q34 -14 64 -3 M60 -78 q28 -11 52 -2" stroke="#6f9ab8"
            stroke-width="2.5" opacity="0.8" fill="none"/>
      <!-- 面甲/眼罩（深色屏）-->
      <path d="M24 -14 q34 -30 82 -18 l 6 26 q-38 -10 -70 14 Z" fill="url(#visor)"/>
      <ellipse cx="70" cy="2" rx="15" ry="9" fill="url(#eye)" filter="url(#glow)"/>
      <!-- 脸颊/下颌装甲 -->
      <path d="M10 16 q30 -18 66 -10 l 18 44 q-6 22 -34 26 q-30 4 -50 -18 Z" fill="url(#mLight)"/>
      <path d="M20 34 q28 -12 56 -6 M26 52 q24 -9 48 -4" stroke="#7fa6c0"
            stroke-width="2.2" opacity="0.7" fill="none"/>
      <!-- 侧耳/传感器 -->
      <path d="M-6 6 q-28 -6 -30 -34 q-2 -24 20 -34 l 12 20 q-14 6 -12 22 q2 14 16 18 Z"
            fill="url(#mLight)"/>
      <circle cx="-14" cy="-30" r="7" fill="url(#core)" filter="url(#glow)"/>
      <!-- 后脑散热口 -->
      <path d="M-10 -6 q-14 -34 2 -66 l 14 10 q-10 24 0 50 Z" fill="url(#mDark)"/>
    </g>

    <!-- 大脑：八卦/64卦神经核（嵌在颅顶发光）-->
    <g transform="translate(56,-72) scale(0.62)">
      __BRAIN_RING__
      <circle r="60" fill="#04121f"/>
      <circle r="60" fill="none" stroke="#7fe3ff" stroke-width="3" filter="url(#glow)"/>
      <circle r="50" fill="url(#core)"/>
      <path d="M0 -50 a50 50 0 0 1 0 100 a25 25 0 0 1 0 -50 a25 25 0 0 0 0 -50 z" fill="#04121f"/>
      <circle cx="0" cy="-25" r="7.5" fill="#7fe3ff"/>
      <circle cx="0" cy="25" r="7.5" fill="#04121f"/>
    </g>
  </g>
  <!-- 大脑光晕 -->
  <circle cx="635" cy="835" r="150" fill="url(#coreGlow)"/>

  <!-- 标注 -->
  <text x="620" y="1290" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="30"
        fill="#7fe3ff" letter-spacing="6">易理系统 · 作为智能之脑</text>
  <text x="620" y="1330" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19"
        fill="#6b93b0" letter-spacing="1.5">符号先验（64卦） → 元胞 → 组织 → 生态 → 通用智能</text>

  <!-- 底部 -->
  <line x1="420" y1="1470" x2="820" y2="1470" stroke="#2b5578" stroke-width="1"/>
  <text x="620" y="1520" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19"
        fill="#5b7f99">https://github.com/qdmxl/ylyw</text>
</svg>
