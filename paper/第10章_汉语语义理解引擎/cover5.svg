<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafb"/>
      <stop offset="0.5" stop-color="#eef4f7"/>
      <stop offset="1" stop-color="#e0eaf0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132639"/>
      <stop offset="1" stop-color="#3c6480"/>
    </linearGradient>
    <!-- 机体金属渐变 -->
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4f8"/>
      <stop offset="0.45" stop-color="#c2d5e2"/>
      <stop offset="0.75" stop-color="#8fb0c6"/>
      <stop offset="1" stop-color="#5b7f98"/>
    </linearGradient>
    <linearGradient id="shellD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbccf"/>
      <stop offset="1" stop-color="#4f7391"/>
    </linearGradient>
    <linearGradient id="joint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5f79"/>
      <stop offset="1" stop-color="#1e394d"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2739"/>
      <stop offset="0.5" stop-color="#1d4359"/>
      <stop offset="1" stop-color="#0d2030"/>
    </linearGradient>
    <radialGradient id="brainGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.42" stop-color="#f4c957" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f4c957" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a6cbe1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a6cbe1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.5" stop-color="#ffcf5a"/>
      <stop offset="1" stop-color="#e0a52e"/>
    </radialGradient>
  </defs>

  <rect width="1240" height="1754" fill="url(#bg)"/>

  <!-- ===== 书名 ===== -->
  <text x="620" y="252" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="118"
        font-weight="bold" fill="url(#title)" letter-spacing="22">易理研物</text>
  <text x="620" y="310" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="34"
        fill="#436473" letter-spacing="4">从符号先验到通用智能的工程研究</text>

  <!-- ===== 大脑光晕 ===== -->
  <ellipse cx="620" cy="600" rx="290" ry="260" fill="url(#halo)"/>
  <circle cx="620" cy="560" r="168" fill="url(#brainGlow)"/>

  <!-- ===== 大脑：八卦神经核 ===== -->
  <g transform="translate(620,560)">
