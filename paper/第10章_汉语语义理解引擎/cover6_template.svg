<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.5" stop-color="#eef4f8"/>
      <stop offset="1" stop-color="#dde8ef"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132639"/>
      <stop offset="1" stop-color="#3c6480"/>
    </linearGradient>
    <!-- 苗条机体：细长高光金属 -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c7f98"/>
      <stop offset="0.35" stop-color="#d7e5ee"/>
      <stop offset="0.5" stop-color="#f2f8fb"/>
      <stop offset="0.65" stop-color="#c3d6e2"/>
      <stop offset="1" stop-color="#53768f"/>
    </linearGradient>
    <linearGradient id="shellV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2f7"/>
      <stop offset="0.5" stop-color="#b6cddc"/>
      <stop offset="1" stop-color="#4f7391"/>
    </linearGradient>
    <linearGradient id="joint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5f79"/>
      <stop offset="1" stop-color="#172f42"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2739"/>
      <stop offset="0.5" stop-color="#1d4359"/>
      <stop offset="1" stop-color="#0d2030"/>
    </linearGradient>
    <!-- 大脑：金色发光核 -->
    <radialGradient id="brainGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c8" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#f6cb5c" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#f6cb5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a9cee4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a9cee4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e2"/>
      <stop offset="0.5" stop-color="#ffd15e"/>
      <stop offset="1" stop-color="#e0a52e"/>
    </radialGradient>
  </defs>

  <rect width="1240" height="1754" fill="url(#bg)"/>

  <!-- ===== 书名 ===== -->
  <text x="620" y="248" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="116"
        font-weight="bold" fill="url(#title)" letter-spacing="22">易理研物</text>
  <text x="620" y="304" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="33"
        fill="#436473" letter-spacing="4">从符号先验到通用智能的工程研究</text>

  <!-- ================= 大脑（视觉主角，放大且精细）================= -->
  <ellipse cx="620" cy="590" rx="300" ry="270" fill="url(#halo)"/>
  <circle cx="620" cy="580" r="215" fill="url(#brainGlow)"/>
  <g transform="translate(620,580)">
    <!-- 外层卦环：64 卦密集排布两环 -->
    __BRAIN_RING__
    <circle r="63" fill="#0f2739"/>
    <circle r="58" fill="none" stroke="#f6cb5c" stroke-width="2" opacity="0.85"/>
    <path d="M0 -42 a42 42 0 0 1 0 84 a21 21 0 0 1 0 -42 a21 21 0 0 0 0 -42 z" fill="#f6cb5c"/>
    <circle cx="0" cy="-21" r="6.5" fill="#0f2739"/>
    <circle cx="0" cy="21" r="6.5" fill="#f6cb5c"/>
  </g>
  <!-- 大脑射线 -->
  <g stroke="#f6cb5c" stroke-width="1.4" opacity="0.5">__RAYS__</g>

  <!-- ================= 机器人（苗条高挑 · 半身）================= -->
  <g transform="translate(620,0)">
    <!-- 颈（细）-->
    <rect x="-11" y="726" width="22" height="36" rx="7" fill="url(#joint)"/>

    <!-- 头（窄长，拟人）-->
    <path d="M-40 636 q0 -46 24 -58 q16 -8 32 0 q24 12 24 58
             q0 44 -18 66 q-16 18 -22 18 q-6 0 -22 -18 q-18 -22 -18 -66 Z"
          fill="url(#shellV)"/>
    <!-- 面罩 -->
    <path d="M-33 632 q0 -32 16 -40 q17 -8 34 0 q16 8 16 40 q0 7 -5 7 L -28 639 q-5 0 -5 -7 Z"
          fill="url(#visor)"/>
    <ellipse cx="-12" cy="628" rx="7.5" ry="7" fill="url(#eye)"/>
    <ellipse cx="12" cy="628" rx="7.5" ry="7" fill="url(#eye)"/>
    <!-- 头侧耳 -->
    <path d="M-40 626 q-12 3 -12 18 q0 15 12 18 Z" fill="url(#shell)"/>
    <path d="M40 626 q12 3 12 18 q0 15 -12 18 Z" fill="url(#shell)"/>
    <circle cx="-50" cy="644" r="4" fill="#f6cb5c"/>
    <circle cx="50" cy="644" r="4" fill="#f6cb5c"/>

    <!-- 肩（窄、斜）-->
    <path d="M-96 806 q52 -30 96 -22 L 0 806 L -96 826 Z" fill="url(#shellV)"/>
    <path d="M96 806 q-52 -30 -96 -22 L 0 806 L 96 826 Z" fill="url(#shellV)"/>

    <!-- 躯干（收腰、修长）-->
    <path d="M-58 796 q58 -20 116 0 L 84 940 q0 24 -18 30 L -66 970 q-18 -6 -18 -30 Z"
          fill="url(#shellV)"/>
    <!-- 胸甲线 -->
    <path d="M-46 818 q46 -14 92 0" fill="none" stroke="#7fa6c0" stroke-width="1.6" opacity="0.6"/>
    <!-- 胸口易徽（太极）-->
    <circle cx="0" cy="872" r="26" fill="#0f2739"/>
    <circle cx="0" cy="872" r="22" fill="none" stroke="#f6cb5c" stroke-width="1.4" opacity="0.8"/>
    <path d="M0 -22 a22 22 0 0 1 0 44 a11 11 0 0 1 0 -22 a11 11 0 0 0 0 -22 z" fill="#f6cb5c"/>

    <!-- 上臂（细长，下垂）-->
    <path d="M-92 812 q-34 26 -40 92 q-3 34 20 36 q20 2 22 -26 l 10 -78 l 20 -12 Z" fill="url(#shellV)"/>
    <path d="M92 812 q34 26 40 92 q3 34 -20 36 q-20 2 -22 -26 l -10 -78 l -20 -12 Z" fill="url(#shellV)"/>
    <!-- 肘关节 -->
    <circle cx="-112" cy="944" r="12" fill="url(#joint)"/>
    <circle cx="112" cy="944" r="12" fill="url(#joint)"/>
    <!-- 前臂 + 细手 -->
    <path d="M-108 954 q-16 30 -10 66 q4 26 22 22 q16 -4 12 -26 l -6 -52 Z" fill="url(#shell)"/>
    <path d="M108 954 q16 30 10 66 q-4 26 -22 22 q-16 -4 -12 -26 l 6 -52 Z" fill="url(#shell)"/>
    <!-- 手（细长手指）-->
    <g stroke="#2a4a60" stroke-width="3" stroke-linecap="round">
      <line x1="-102" y1="1046" x2="-104" y2="1074"/>
      <line x1="-94" y1="1048" x2="-95" y2="1078"/>
      <line x1="-86" y1="1048" x2="-87" y2="1076"/>
      <line x1="102" y1="1046" x2="104" y2="1074"/>
      <line x1="94" y1="1048" x2="95" y2="1078"/>
      <line x1="86" y1="1048" x2="87" y2="1076"/>
    </g>
    <!-- 腰腹分割线 -->
    <g stroke="#8fb2c9" stroke-width="1.6" opacity="0.55">
      <line x1="-46" y1="952" x2="46" y2="952"/>
    </g>
  </g>

  <!-- 大脑→身体 信号 -->
  <g stroke="#f6cb5c" stroke-width="1.6" opacity="0.55">
    <line x1="620" y1="668" x2="620" y2="726"/>
    <line x1="592" y1="660" x2="572" y2="712"/>
    <line x1="648" y1="660" x2="668" y2="712"/>
  </g>

  <!-- 标注 -->
  <text x="620" y="1130" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="30"
        fill="#a8791f" letter-spacing="6">易理系统 · 作为智能之脑</text>
  <text x="620" y="1170" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="19"
        fill="#6b8698" letter-spacing="1.5">符号先验（64卦） → 元胞 → 组织 → 生态 → 通用智能</text>

  <!-- 作者 -->
  <line x1="400" y1="1300" x2="840" y2="1300" stroke="#c9b98e" stroke-width="1"/>
  <text x="620" y="1380" text-anchor="middle" font-family="Noto Serif CJK SC" font-size="46"
        fill="#22384a" letter-spacing="14">马兴录　马圣洁　李诚　著</text>
  <text x="620" y="1446" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="26"
        fill="#5a6b7a">青岛科技大学　信息科学技术学院</text>
  <text x="620" y="1506" text-anchor="middle" font-family="Noto Sans CJK SC" font-size="22"
        fill="#8a7a55">2026</text>
</svg>
